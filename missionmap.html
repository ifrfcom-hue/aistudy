    h+=`<h3>우리 팀 경로</h3>${r.length? routeHTML(m,r):'<p class="muted small">지도에서 장소를 눌러 시작</p>'}`;
    if(play.fail) h+=`<p><span class="pill bad">실패</span> ${esc(play.fail)}</p>`;
    if(play.win) h+=`<p><span class="pill ok">완료</span> ${esc(play.win)}</p>`;
  }
  h+=`<div class="btnrow"><button class="btn" id="undo" ${mission!=="treasure"&&r.length&&!play.done?"":"disabled"}>한 칸 되돌리기</button><button class="btn" id="resetR">처음부터</button>${G&&!G.finished?"":`<button class="btn coral" id="reveal">${play.revealed?"정답 가리기":"설계 팀 정답 확인"}</button>`}${G&&G.finished?`<button class="btn primary" id="backBoard">미션 보드로 돌아가기</button>`:""}</div>`;
  if(play.revealed){
    const body = mission==="clean"? panelClean(m,R,true) : mission==="deliver"? panelDeliver(m,R,true) : panelTreasure(m,R,true);
    let judge="";
    if(mission==="deliver"&&play.done&&R.ham.best){ const c=pathCost(m,r); judge = c===R.ham.best.cost? `<p><span class="pill ok">최단 정답!</span></p>`:`<p><span class="pill warn">${m100(c-R.ham.best.cost)} 더 김</span> 최단은 ${m100(R.ham.best.cost)}</p>`; }
    if(mission==="treasure"&&play.results&&R.g&&R.a){ const sameP=(x,y)=>x&&y&&x.join()===y.join(); judge=`<p>${play.results.g? (sameP(play.results.g.path,R.g.path)?'<span class="pill ok">탐지기 추적 정답</span>':'<span class="pill warn">탐지기 추적 다름</span>'):""} ${play.results.a? (sameP(play.results.a.path,R.a.path)?'<span class="pill ok">내비 추적 정답</span>':'<span class="pill warn">내비 추적 다름</span>'):""}</p>`; }
    h+=`<div class="reveal">${judge}${body}</div>`;
  }
  panel.innerHTML=h;
  const $=id=>document.getElementById(id);
  $("playExit").onclick=()=>{ play=null; highlight=null; anim=null; renderAll(); window.scrollTo({top:0}); };
  if($("undo")) $("undo").onclick=()=>{ play.route.pop(); renderAll(); };
  if(G) $("resetR").hidden = !!G.finished || G.mission!=="deliver";
  $("resetR").onclick=()=>{ play.route=[]; play.done=false; play.fail=null; play.win=null; if(mission==="clean"){ play.extra=null; play.ctMode=false; } if(mission==="treasure") trInit(); highlight=null; renderAll(); };
  if($("reveal")) $("reveal").onclick=()=>{ play.revealed=!play.revealed; highlight=null; renderAll(); };
  if($("backBoard")) $("backBoard").onclick=()=>{ play=null; highlight=null; anim=null; renderAll(); window.scrollTo({top:0}); };
  if($("giveUp")) $("giveUp").onclick=()=>{ if(!play.giveArm){ play.giveArm=true; renderPanel(); setTimeout(()=>{ if(play){ play.giveArm=false; renderPanel(); } },3000); return; } finishGame(false,"포기"); };
  if($("ctBtn")) $("ctBtn").onclick=()=>{ play.ctMode=!play.ctMode; play.ctFirst=null; renderAll(); };
  const setTm=v=>{ play.tmode=v; trInit(); highlight=null; anim=null; renderAll(); };
  if($("tmG")){ $("tmG").onclick=()=>setTm("g"); $("tmA").onclick=()=>setTm("a"); }
  if($("tryA")) $("tryA").onclick=()=>setTm("a");
  panel.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>trPick(b.dataset.pick));
  if(play.revealed) wirePanel(m,R);
}
function startPlay(m, mission, slot, gameInfo){
  play={map:m, from:m.team||"", slot:slot||null, route:[], mission:mission||"clean", revealed:false, tmode:gameInfo&&mission==="treasure"?"a":"g", extra:null, tr:null, game:gameInfo||null};
  tab=play.mission; if(tab==="treasure") trInit(); highlight=null; anim=null; renderAll();
  toast(`${MISSIONS[tab].t} 미션 시작!`);
  requestAnimationFrame(()=>{ const bc=document.querySelector(".boardcard"); if(bc) bc.scrollIntoView({behavior:reduce?"auto":"smooth", block:"start"}); });
}

/* ---------- map code ---------- */
function encodeMap(){
  const o={v:1,team, n:S.nodes.map(n=>[n.label,n.name,Math.round(n.x),Math.round(n.y),+n.h||0,kindOf(n)||""]), e:S.edges.map(e=>[S.nodes.findIndex(n=>n.id===e.a),S.nodes.findIndex(n=>n.id===e.b),e.w]), s:S.nodes.findIndex(n=>n.id===S.start), t:S.nodes.findIndex(n=>n.id===S.goal), f:S.fuel};
  return "CRR1:"+btoa(unescape(encodeURIComponent(JSON.stringify(o))));
}
function decodeMap(str){
  try{
    const s=str.trim().replace(/\s+/g,""); if(!s.startsWith("CRR1:")) return null;
    const o=JSON.parse(decodeURIComponent(escape(atob(s.slice(5)))));
    const nodes=o.n.map((a,i)=>({id:"p"+i,label:String(a[0]).slice(0,2),name:String(a[1]||"").slice(0,8),x:+a[2],y:+a[3],h:+a[4]||0,kind:(a[5]&&BMAP[a[5]])?a[5]:undefined}));
    if(nodes.length<2||nodes.length>12) return null;
    const edges=o.e.filter(a=>nodes[a[0]]&&nodes[a[1]]).map((a,i)=>({id:"q"+i,a:"p"+a[0],b:"p"+a[1],w:Math.max(1,Math.round(+a[2]||1))}));
    return {nodes,edges,start:"p"+o.s,goal:"p"+o.t,fuel:+o.f||0,bg:null,team:String(o.team||"").slice(0,16)};
  }catch(e){ return null; }
}
function showCodeDialog(){
  const code=encodeMap();
  const R=analyze(S), bad=checks(S,R).filter(c=>c.st==="bad");
  const root=document.getElementById("dlgRoot");
  root.innerHTML=`<div class="overlay" id="ov"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgT">
    <h2 id="dlgT">${mySlot}조 지도 코드 생성</h2>
    ${bad.length? `<p class="small"><span class="pill bad">품질 점검 빨간 항목 ${bad.length}개</span> ${bad.map(b=>esc(b.t)).join(" · ")} — 고친 뒤 다시 생성하는 것을 권장해요.</p>`:`<p class="small"><span class="pill ok">품질 점검 통과</span> 출제 준비 완료!</p>`}
    <p class="small muted">아래 코드를 복사해 <b>미션 교환 플레이</b> 화면의 <b>${mySlot}조 칸</b>에 붙여 넣고 등록하세요. 지도를 고치면 코드를 다시 생성해야 해요.</p>
    <textarea id="codeOut" readonly style="min-height:96px">${code}</textarea>
    <div class="btnrow"><button class="btn primary" id="copyCode">코드 복사</button><button class="btn" id="submitDlg">이 기기에서 ${mySlot}조 칸에 바로 등록</button></div>
    <h3>코드로 설계 불러오기</h3>
    <textarea id="codeIn" placeholder="CRR1: 로 시작하는 코드"></textarea>
    <div class="btnrow"><button class="btn" id="loadCode">설계 지도로 불러오기</button><button class="btn" id="closeDlg">닫기</button></div>
  </div></div>`;
  const close=()=>root.innerHTML="";
  document.getElementById("closeDlg").onclick=close;
  document.getElementById("ov").addEventListener("click",e=>{ if(e.target.id==="ov") close(); });
  document.getElementById("submitDlg").onclick=async()=>{ await submitMine(); close(); };
  document.getElementById("copyCode").onclick=async()=>{ const ta=document.getElementById("codeOut"); try{ await navigator.clipboard.writeText(code); toast("코드를 복사했어요"); }catch(e){ ta.focus(); ta.select(); toast("선택된 코드를 직접 복사하세요"); } };
  document.getElementById("loadCode").onclick=()=>{ const m=decodeMap(document.getElementById("codeIn").value); if(!m){ toast("코드를 읽을 수 없어요"); return; } team=m.team||team; delete m.team; S=m; sel=null; close(); commit(); document.getElementById("teamName").value=team; toast("불러왔어요"); };
  setTimeout(()=>{ const ta=document.getElementById("codeOut"); if(ta){ ta.focus(); ta.select(); } },30);
}

/* ---------- misc ---------- */
const hintEl=document.getElementById("hint");
function setHint(){
  if(mode==="play"){
    if(!play){ hintEl.innerHTML = (!game||game.status==="setup")? "<b>미션 게임 준비</b> 5개 조의 코드를 아래 칸에 붙여 넣어 등록하면 게임을 시작할 수 있어요." : "<b>미션 보드</b> 아래에서 우리 조 미션을 시작하세요."; return; }
    const t={clean:"<b>청소로봇</b> 장소를 차례로 눌러 도로를 지나가요. 같은 도로를 두 번 지나면 실패!",deliver:"<b>배달드론</b> 출발점부터 장소를 차례로 눌러요. 모든 장소를 한 번씩!",treasure:"<b>보물탐지</b> 지도에서 건물을 누르면 후보 바구니에 들어가요. 아래 바구니 카드를 누르면 방문 완료로 옮겨지고 로봇이 이동해요."}[tab];
    const whose = play.slot? `<span class="pill" style="background:var(--navy);color:var(--paper)">${play.slot}조${play.from?" 「"+esc(play.from)+"」":""} 지도</span> ` : `<span class="pill">우리 지도 연습</span> `;
    hintEl.innerHTML = whose + (play.ctMode? "<b>공사권</b> 새 도로를 놓을 두 장소를 차례로 누르세요." : t); return;
  }
  hintEl.innerHTML = {
    select:"<b>선택·이동</b> 장소를 끌어 옮기고, 장소나 도로 숫자를 눌러 아래에서 고쳐요.",
    place:`<b>＋ ${(BMAP[placeKind]||BMAP.other).n}</b> 지도의 빈 곳을 누르면 놓여요 (최대 ${MAX_NODES}곳). 위 줄에서 다른 건물을 고를 수 있어요.`,
    road: pending? `<b>― 도로 잇기</b> <b>${esc(lab(S,pending))}</b>와 이을 장소를 누르세요 (같은 장소를 다시 누르면 취소).`:"<b>― 도로 잇기</b> 이을 두 장소를 차례로 눌러요. 길이는 자로 잰 값으로 먼저 정해져요.",
    erase:"<b>✕ 지우기</b> 지울 장소나 도로를 누르세요. 장소를 지우면 이어진 도로도 사라져요.",
  }[tool];
}
function setTool(t){ tool=t; pending=null; document.querySelectorAll(".tool[data-tool]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tool===t)); setHint(); render(); renderPalette(); }
document.getElementById("palette").addEventListener("click",e=>{ const b=e.target.closest("[data-kind]"); if(!b) return; placeKind=b.dataset.kind; setTool("place"); });
document.getElementById("toolbar").addEventListener("click",e=>{ const b=e.target.closest("[data-tool]"); if(b) setTool(b.dataset.tool); });
document.getElementById("btnMeasure").onclick=()=>{ S.nodes.forEach(n=>n.h=measureH(n)); commit(); toast("모든 h를 보물까지 직선거리로 다시 쟀어요"); };
document.getElementById("preset").addEventListener("change",e=>{ const v=e.target.value; e.target.value=""; if(!v) return; const bg=S.bg, bm=S.bgMode; S=build(PRESETS[v]); S.bg=bg; S.bgMode=bm||"school"; sel=null; highlight=null; commit(); toast(v==="blank"?"새 지도를 시작해요":"지도를 불러왔어요"); });
const bgSel=document.getElementById("bgMode");
bgSel.addEventListener("change",()=>{ const v=bgSel.value;
  if(v==="photo"){ if(S.bg){ S.bgMode="photo"; commit(); } else { bgSel.value=S.bgMode||"school"; document.getElementById("bgFile").click(); } return; }
  S.bgMode=v; commit(); });
document.getElementById("bgFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=()=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement("canvas"); const sc=Math.min(1,1400/img.width); c.width=img.width*sc; c.height=img.height*sc; c.getContext("2d").drawImage(img,0,0,c.width,c.height); S.bg=c.toDataURL("image/jpeg",.7); S.bgMode="photo"; commit(); toast("학교 배치도를 깔았어요. 위에 장소를 찍어 보세요"); }; img.src=fr.result; }; fr.readAsDataURL(f); e.target.value=""; });
document.getElementById("btnCode").onclick=showCodeDialog;
const slotEl=document.getElementById("mySlot");
try{ mySlot=+(localStorage.getItem("crr-myslot")||1)||1; }catch(e){}
slotEl.value=String(mySlot);
slotEl.addEventListener("change",()=>{ const k=+slotEl.value; try{ localStorage.setItem("crr-myslot",String(k)); }catch(e){} switchSlot(k); });
document.getElementById("sendBtn").onclick=sendMine;
const teamEl=document.getElementById("teamName");
teamEl.addEventListener("input",()=>{ team=teamEl.value; save(); if(tab==="cards") renderPanel(); updateSendBtn(); });
const MODE_HASH={design:"design",play:"play",teams:"teams",score:"scoreboard"};
function setMode(md, fromHash){
  if((md==="teams"||md==="score") && !isAdmin && !fromHash){ adminDialog(()=>setMode(md)); return; }
  mode=md;
  [["modeDesign","design"],["modePlay","play"],["modeTeams","teams"],["modeScore","score"]].forEach(([id,v])=>document.getElementById(id).setAttribute("aria-pressed",md===v));
  document.getElementById("toolbar").hidden = md!=="design";
  document.querySelector(".boardcard").hidden = (md==="teams"||md==="score");
  sel=null; pending=null; highlight=null; anim=null; tab = md==="play"?"clean":"table";
  if(!fromHash){ try{ history.replaceState(null,"","#"+MODE_HASH[md]); }catch(e){} }
  renderAll(); }
function modeFromHash(){ const h=(location.hash||"").slice(1); const m=Object.keys(MODE_HASH).find(k=>MODE_HASH[k]===h); return m||null; }
window.addEventListener("hashchange",()=>{ const m=modeFromHash(); if(m&&m!==mode) setMode(m,true); });
document.getElementById("modeDesign").onclick=()=>setMode("design");
document.getElementById("homeLink").addEventListener("click",e=>{ e.preventDefault(); play=null; document.getElementById("dlgRoot").innerHTML=""; setMode("design"); window.scrollTo({top:0, behavior: reduce?"auto":"smooth"}); });
document.getElementById("modePlay").onclick=()=>setMode("play");
document.getElementById("modeTeams").onclick=()=>setMode("teams");
document.getElementById("modeScore").onclick=()=>setMode("score");
document.getElementById("adminBtn").onclick=()=>{ if(isAdmin){ setAdmin(false); toast("관리자 모드에서 나왔어요"); if(mode==="teams"||mode==="score") setMode("play"); else renderAll(); } else adminDialog(); };
let tt; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2200); }
function updateBgBtn(){ const o=bgSel.querySelector('option[value="photo"]'); o.textContent = S.bg? "배경: 배치도 사진":"배경: 배치도 사진 올리기…"; bgSel.value = S.bgMode||"school"; }
function commit(){ highlight=null; save(); renderAll(); }
function renderAll(){ updateAdminUI(); renderTabs(); render(); renderPanel(); setHint(); updateBgBtn(); renderPalette(); updateSendBtn();
  document.querySelector(".boardcard").hidden = (mode==="teams"||mode==="score"||(mode==="play"&&!play)); }
document.addEventListener("keydown",e=>{ if(mode!=="design"||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==="Delete"||e.key==="Backspace"){ if(sel&&sel.type==="node") removeNode(sel.id); else if(sel&&sel.type==="edge"){ S.edges=S.edges.filter(x=>x.id!==sel.id); sel=null; commit(); } }
  if(e.key==="Escape"){ sel=null; pending=null; renderAll(); } });

load(); teamEl.value=team; { const hm=modeFromHash(); if(hm) setMode(hm,true); else renderAll(); } initDB();
window.__test = {analyze, S:()=>S, build, PRESETS, encodeMap, decodeMap, checks, play:()=>play, game:()=>game, results:()=>results};
})();
