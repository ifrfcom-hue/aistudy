<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>미션 맵 설계 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 게임판(지도) 가운데 위 + 해설·미션 패널은 그 아래.
   Palette: 수업 슬라이드의 네이비·노랑·코랄·민트·블루 카드 색을 그대로 씀. */
:root{
  --navy:#20223F; --yellow:#F5B301; --coral:#E9505A; --mint:#169C83; --blue:#2F6FD6;
  --bg:#EEF0F5; --paper:#FFFFFF; --board:#F7F8FB; --grid:#E1E4EC;
  --ink:#20223F; --ink-2:#585C78; --line:#D6D9E3; --road:#8E95AE; --chip:#E8EAF2;
  --ok:#14866F; --warn:#B7790A; --bad:#C93A44;
  --chalk:#2E4B3C; --chalk-ink:#F4F6EE; --wood:#9A6A43;
  --wall:#EEF1E6; --wall2:#E4E9DA; --wains:#DCCBAA; --rail:#B99668; --base:#6F4B2C; --floor1:#CB9963; --floor2:#BD8A55; --seam:rgba(80,46,18,.38);
  --grass:#CFE6B4; --field:#9ED27E; --track:#E5866B; --path:#F6E9CC; --path-ln:#E2CDA2; --plaza:#EFE3C8; --bldg:#FFFDF7; --bldg-ln:#5B5F78; --roof:#4F79B8; --brick:#D9826B; --brick2:#E3A07A; --glass:#8CC7E8; --dome:#5E8FD0; --win:#BFE0F5; --tree:#6DBB54; --tree2:#459A3E; --trunk:#9A6B45; --water:#7CC4EC; --water-hi:#FFFFFF;
  --f-display:"Black Han Sans","IBM Plex Sans KR",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12131F; --paper:#1B1D2E; --board:#161828; --grid:#24273A;
  --ink:#ECEEF6; --ink-2:#A3A8C3; --line:#30344C; --road:#6E7594; --chip:#262A40;
  --grass:#1A2B1E; --field:#24402A; --track:#5A3229; --path:#34333A; --path-ln:#45434C; --plaza:#3A3730; --bldg:#2C2F43; --bldg-ln:#9095B3; --roof:#3D5A8A; --brick:#7A4639; --brick2:#80523F; --glass:#33607A; --dome:#3C5F94; --win:#3E5F7F; --tree:#2F5B2B; --tree2:#244621; --trunk:#5C4330; --water:#28597A; --water-hi:#9FD4F2; --navy:#D9DCF0; --ok:#3CC7A6; --warn:#F2B53A; --bad:#FF7A82; --mint:#2BB898; --blue:#5B91F0; --chalk:#1E3328; --chalk-ink:#E8EEE2; --wood:#6E4A2E; --wall:#1D221F; --wall2:#232924; --wains:#2E2921; --rail:#4A3B28; --base:#3A2818; --floor1:#4C3624; --floor2:#433020; --seam:rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12131F; --paper:#1B1D2E; --board:#161828; --grid:#24273A;
  --ink:#ECEEF6; --ink-2:#A3A8C3; --line:#30344C; --road:#6E7594; --chip:#262A40;
  --grass:#1A2B1E; --field:#24402A; --track:#5A3229; --path:#34333A; --path-ln:#45434C; --plaza:#3A3730; --bldg:#2C2F43; --bldg-ln:#9095B3; --roof:#3D5A8A; --brick:#7A4639; --brick2:#80523F; --glass:#33607A; --dome:#3C5F94; --win:#3E5F7F; --tree:#2F5B2B; --tree2:#244621; --trunk:#5C4330; --water:#28597A; --water-hi:#9FD4F2; --navy:#D9DCF0; --ok:#3CC7A6; --warn:#F2B53A; --bad:#FF7A82; --mint:#2BB898; --blue:#5B91F0; --chalk:#1E3328; --chalk-ink:#E8EEE2; --wood:#6E4A2E; --wall:#1D221F; --wall2:#232924; --wains:#2E2921; --rail:#4A3B28; --base:#3A2818; --floor1:#4C3624; --floor2:#433020; --seam:rgba(0,0,0,.45); color-scheme:dark}
/* 교실: 벽(줄무늬 벽지) · 걸레받이 아래 징두리 판벽 · 맨 아래 나무 마룻바닥 */
html{min-height:100%;background:var(--wall)}
body{background-color:var(--wall);
  background-image:
    linear-gradient(to bottom, rgba(0,0,0,.16), transparent 70px),
    linear-gradient(var(--base),var(--base)),
    repeating-linear-gradient(180deg, transparent 0 40px, var(--seam) 40px 42px),
    repeating-linear-gradient(90deg, var(--seam) 0 2px, transparent 2px 210px),
    repeating-linear-gradient(90deg, var(--floor1) 0 70px, var(--floor2) 70px 140px, var(--floor1) 140px 210px),
    linear-gradient(var(--rail),var(--rail)),
    repeating-linear-gradient(90deg, var(--wains) 0 58px, color-mix(in srgb,var(--wains) 85%,#000) 58px 60px),
    repeating-linear-gradient(90deg, var(--wall) 0 46px, var(--wall2) 46px 48px);
  background-size:100% 210px,100% 14px,100% 210px,100% 210px,100% 210px,100% 8px,100% 120px,100% 100%;
  background-position:left bottom,left bottom 210px,left bottom,left bottom,left bottom,left bottom 344px,left bottom 224px,0 0;
  background-repeat:no-repeat}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{color:var(--ink);min-height:100%;font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 230px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;background:var(--chalk);color:var(--chalk-ink);padding:14px 18px;border-radius:12px;border:7px solid var(--wood);box-shadow:inset 0 0 40px rgba(0,0,0,.25);position:relative}
header.top::after{content:"";position:absolute;left:18%;right:18%;bottom:-7px;height:5px;background:var(--wood);filter:brightness(.8);border-radius:0 0 4px 4px}
.homelink{color:inherit;text-decoration:none;cursor:pointer;border-radius:6px}.homelink:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
header.top .brand h1{color:var(--chalk-ink);text-shadow:0 0 1px rgba(255,255,255,.4)}
header.top .brand .sub,header.top .team label{color:color-mix(in srgb,var(--chalk-ink) 75%,transparent)}
header.top .team input,header.top .team select{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:var(--chalk-ink)}
header.top .team select option{color:#20223F}
.sendbtn{border:0;border-radius:8px;padding:7px 16px;font-weight:700;background:#F5B301;color:#20223F;box-shadow:0 2px 0 #B98500;white-space:nowrap}
.adminbtn{border:1px solid rgba(255,255,255,.4);background:transparent;color:var(--chalk-ink);border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px;white-space:nowrap}
.adminbtn.on{background:var(--chalk-ink);color:var(--chalk)}
.sendbtn.sent{background:#3CC7A6;box-shadow:0 2px 0 #1F8E74}
.sendbtn.changed{background:#FF8A5B;box-shadow:0 2px 0 #C4552B}
.sendbtn:disabled{opacity:.5}
.mini{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:var(--grass)}
header.top .modes{background:rgba(255,255,255,.12)}
header.top .modes button{color:color-mix(in srgb,var(--chalk-ink) 75%,transparent)}
header.top .modes button[aria-pressed="true"]{background:var(--chalk-ink);color:var(--chalk)}
.chalkdust{display:flex;gap:6px;align-items:center;font-size:12px}
.chalkdust i{width:22px;height:6px;border-radius:2px;display:inline-block}
/* class board */
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.slot{border:1.5px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:5px;min-width:0;background:var(--paper);transition:transform .12s,box-shadow .12s}
.slot.empty{border-style:dashed;background:var(--board)}
.slot.mine{border-color:var(--blue)}
.slot.spin{transform:scale(1.04);box-shadow:0 0 0 3px var(--yellow)}
.slot .sh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.slot .no{font-family:var(--f-display);font-size:18px}
.slot code{font-family:var(--f-mono);font-size:11px;background:var(--chip);border-radius:6px;padding:3px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.drawbtn{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:0;background:var(--yellow);color:#20223F;font-family:var(--f-display);font-size:20px;letter-spacing:.02em}
.drawbtn:disabled{opacity:.5}
tr.mine td{background:color-mix(in srgb,var(--blue) 10%,transparent)}
/* basket */
.bk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bk>section{border:1.5px solid var(--line);border-radius:12px;padding:8px;min-width:0;min-height:120px}
.bk>section.q{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 6%,transparent)}
.bk>section.v{border-color:var(--mint);background:color-mix(in srgb,var(--mint) 6%,transparent)}
.bk h4{margin:0 0 6px;font-size:13px;display:flex;justify-content:space-between;gap:4px}
.bcards{display:flex;flex-wrap:wrap;gap:6px}
.bcard{border:1.5px solid var(--ink);border-radius:9px;background:var(--paper);padding:5px 8px;min-width:64px;text-align:left;font-size:12px;line-height:1.3}
.bcard b{font-size:18px;display:block}
.bcard .mono{font-size:11px}
.bcard.done{opacity:.7;border-style:dashed;cursor:default}
.trsteps{margin:6px 0;padding-left:20px}.trsteps li{margin:2px 0;color:var(--ink-2)}.trsteps li.on{color:var(--ink);font-weight:600}
.nextstep{border-left:4px solid var(--coral);background:color-mix(in srgb,var(--coral) 8%,transparent);padding:6px 10px;border-radius:6px;margin:6px 0;font-size:13px}
.gauge{display:flex;flex-wrap:wrap;gap:2px;margin:6px 0}
.gauge i{width:16px;height:14px;border:1px solid var(--line);border-radius:3px;background:var(--board)}
.gauge i.on{background:var(--yellow);border-color:#C99300}
.gauge i.over{background:var(--coral);border-color:var(--coral)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0;letter-spacing:.01em}
.brand .sub{color:var(--ink-2);font-size:13px}
.team{display:flex;align-items:center;gap:6px;margin-left:auto}
.team label{font-size:12px;color:var(--ink-2)}
.team input{width:120px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.modes{flex-wrap:wrap;display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.modes button{white-space:nowrap;border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:600;color:var(--ink-2)}
.modes button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* 지도는 가운데 위, 해설·미션 패널은 그 아래 */
.main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;justify-items:center}
.main>.boardcard,.main>.side{width:100%;max-width:1080px}
.tabs{justify-content:center}

.boardcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border-bottom:1px solid var(--line);align-items:center}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);padding:6px 10px;border-radius:8px;font-weight:600;font-size:13px}
.tool[aria-pressed="true"]{background:var(--navy);color:var(--paper);border-color:var(--navy)}
:root[data-theme="dark"] .tool[aria-pressed="true"]{color:#1B1D2E}
.tool .k{font-family:var(--f-mono);font-size:11px;opacity:.6}
.sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.toolbar select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-size:13px}
.palette{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}
.pal-t{font-size:12px;font-weight:700;color:var(--ink-2);white-space:nowrap;margin-right:2px}
.bchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 10px 3px 3px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.bchip .bic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff}
.bchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--yellow)}
.kindgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:5px;margin-top:4px}
.kindgrid button{display:flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:3px 6px 3px 3px;font-size:12px;font-weight:600}
.kindgrid button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--yellow)}
.kindgrid .bic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.hint{padding:8px 12px;font-size:13px;color:var(--ink-2);background:var(--board);border-bottom:1px solid var(--line);min-height:36px}
.hint b{color:var(--ink)}
.svgbox{position:relative;background:var(--board);touch-action:none}
svg#map{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 12px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-2px;margin-right:4px;border:2px solid var(--navy)}

/* side panel */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.panel h3{font-size:14px;margin:14px 0 6px}
.panel p{margin:4px 0}
.muted{color:var(--ink-2)}
.small{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.robotband{height:6px;border-radius:3px;margin:-14px -16px 12px;border-radius:14px 14px 0 0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink-2);font-weight:600}
td input{width:100%;min-width:48px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--board)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip)}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.answer{background:var(--board);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.answer .big{font-family:var(--f-mono);font-size:15px;font-weight:600;word-break:break-all}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.btn.mint{background:var(--mint);border-color:var(--mint);color:#fff}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.check{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 8px;align-items:start;padding:7px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;margin-top:1px}
.ic.ok{background:var(--ok)} .ic.warn{background:var(--warn)} .ic.bad{background:var(--bad)}
.meter{height:10px;border-radius:5px;background:var(--chip);overflow:hidden;margin:6px 0 2px}
.meter>span{display:block;height:100%;background:var(--mint);transition:width .3s}
.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.field input,.field select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--board);color:var(--ink);font-size:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--paper);font-weight:700}
.stepper input{width:64px;text-align:center}
textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--board);font-family:var(--f-mono);font-size:12px;word-break:break-all}
.route{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--f-mono);font-weight:600}
.route span.n{background:var(--chip);border-radius:6px;padding:1px 7px}
.route span.a{color:var(--ink-2)}
.trace td:first-child{color:var(--ink-2)}
.cardsheet{display:grid;gap:10px}
.mcard{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;font-size:12.5px}
.mcard>div{padding:10px 12px;min-width:0}
.mcard>div+div{border-left:2px dashed var(--ink-2)}
.mcard .ttl{font-weight:700;margin-bottom:4px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.mcard .band{grid-column:1/-1;height:6px;padding:0}
@media (max-width:560px){.mcard{grid-template-columns:1fr}.mcard>div+div{border-left:0;border-top:2px dashed var(--ink-2)}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--paper);padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.overlay{position:fixed;inset:0;background:rgba(10,12,25,.55);display:grid;place-items:center;z-index:30;padding:16px}
.dialog{background:var(--paper);border-radius:14px;max-width:560px;width:100%;padding:18px;border:1px solid var(--line);max-height:90vh;overflow:auto}
.dialog h2{font-family:var(--f-display);font-weight:400;margin:0 0 8px;font-size:20px}
.playhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.reveal{border:2px solid var(--coral);border-radius:12px;padding:10px 12px;margin-top:10px}
.rspanel{border:1.5px solid var(--coral);border-radius:12px;padding:8px 12px;margin-top:12px;background:color-mix(in srgb,var(--coral) 5%,var(--paper))}
.rspanel summary{cursor:pointer;padding:2px 0}
.rsrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rsrow .btn{white-space:nowrap}
.tround{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}

<script>
(() => {
"use strict";
const STORE_KEY = "crr-mission-studio-v1";
const GRID = 50;               // 1칸 = 50 단위 = 100 m
const MAX_NODES = 8;
const LETTERS = "ABCDEFGH";
const COLORS = {clean:"var(--mint)", deliver:"var(--blue)", treasure:"var(--coral)"};

/* ---------- presets ---------- */
const PRESETS = {
  blank: () => ({nodes:[
      {id:"n1",label:"S",name:"출발점",x:100,y:300,h:0},
      {id:"n2",label:"T",name:"보물",x:900,y:300,h:0}],
    edges:[], start:"n1", goal:"n2", fuel:1200, bg:null}),
  teacher: () => ({nodes:[
      {id:"n1",label:"S",name:"기숙사",x:65,y:407,h:8.1},
      {id:"n2",label:"A",name:"급식실",x:270,y:110,h:6.3},
      {id:"n3",label:"B",name:"본관",x:480,y:506,h:4.5},
      {id:"n4",label:"C",name:"도서관",x:584,y:110,h:3.6},
      {id:"n5",label:"D",name:"체육관",x:690,y:506,h:2.8},
      {id:"n6",label:"T",name:"실험동",x:898,y:307,h:0}],
    edges:[["n1","n2",4],["n1","n3",5],["n2","n4",3],["n2","n3",5],["n3","n5",2],["n4","n5",5],["n4","n6",4],["n5","n6",8]],
    start:"n1", goal:"n6", fuel:1200, bg:null}),
  campus: () => ({nodes:[
      {id:"n1",label:"A",name:"정문",x:62,y:280,h:8.1},
      {id:"n2",label:"B",name:"본관",x:282,y:195,h:6.0},
      {id:"n3",label:"C",name:"과학관",x:282,y:450,h:6.7},
      {id:"n4",label:"D",name:"도서관",x:500,y:110,h:4.1},
      {id:"n5",label:"E",name:"체육관",x:610,y:450,h:4.2},
      {id:"n6",label:"F",name:"기숙사",x:938,y:195,h:0},
      {id:"n7",label:"G",name:"식당",x:720,y:280,h:2.2}],
    edges:[["n1","n2",3],["n1","n3",3],["n2","n3",3],["n2","n4",3],["n3","n5",3],["n4","n5",5],["n4","n7",5],["n4","n6",7],["n5","n7",3],["n7","n6",3]],
    start:"n1", goal:"n6", fuel:1250, bg:null}),
};
function build(p){
  const s = p();
  s.edges = s.edges.map((e,i)=>({id:"e"+(i+1),a:e[0],b:e[1],w:e[2]}));
  return s;
}

/* ---------- state ---------- */
let S = build(PRESETS.blank);   // design map (조마다 따로 저장)
let team = "";
let mode = "design";
let tool = "select";
let tab = "table";
let sel = null;          // {type:'node'|'edge', id}
let pending = null;      // node id for road tool
let anim = null;         // {path:[ids], color, t}
let highlight = null;    // {edges:Set, color, nodes:[]}
let play = null;         // {map, from, revealed, mission, route:[], extra:null, tmode}
let ctPick = null;       // 공사권 choice for card

// 조마다 설계 지도를 따로 저장 (한 기기에서 여러 조가 설계해도 섞이지 않게)
const slotKey = k => STORE_KEY+"-s"+k;
function readDraft(k){
  try{ const raw=localStorage.getItem(slotKey(k)); if(raw){ const o=JSON.parse(raw); if(o&&o.map&&Array.isArray(o.map.nodes)) return o; } }catch(e){}
  return null;
}
function load(){
  let d=readDraft(mySlot);
  if(!d){ // 예전 버전의 하나짜리 저장본은 지금 조로 옮겨 옴
    try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const o=JSON.parse(raw); if(o&&o.map&&Array.isArray(o.map.nodes)) d=o; localStorage.removeItem(STORE_KEY); } }catch(e){}
  }
  if(d){ S=d.map; team=d.team||""; } else { S=build(PRESETS.blank); team=""; }
}
function switchSlot(k){
  save();
  mySlot=k;
  const d=readDraft(k);
  if(d){ S=d.map; team=d.team||""; }
  else if(boardMaps[String(k)]){ const m=decodeMap(boardMaps[String(k)].code); if(m){ team=m.team||boardMaps[String(k)].name||""; delete m.team; m.bgMode="school"; S=m; } else { S=build(PRESETS.blank); team=""; } }
  else { S=build(PRESETS.blank); team=""; }
  sel=null; pending=null; highlight=null;
  document.getElementById("teamName").value=team;
  save(); renderAll();
  toast(`${k}조 지도를 열었어요`+(d||boardMaps[String(k)]?"":" (새 지도)"));
}
function save(){
  try{ localStorage.setItem(slotKey(mySlot), JSON.stringify({map:S, team})); }catch(e){
    try{ const c = {...S, bg:null}; localStorage.setItem(slotKey(mySlot), JSON.stringify({map:c, team})); }catch(_){}
  }
}

/* ---------- graph helpers ---------- */
const M = () => mode==="play" && play ? play.map : S;
const nodeById = (m,id) => m.nodes.find(n=>n.id===id);
const lab = (m,id) => { const n=nodeById(m,id); return n? n.label : "?"; };
const sortByLabel = (m,ids) => ids.slice().sort((a,b)=>lab(m,a).localeCompare(lab(m,b)));
function adj(m, extra){
  const A = {}; m.nodes.forEach(n=>A[n.id]=[]);
  const es = extra? m.edges.concat(extra): m.edges;
  es.forEach(e=>{ if(A[e.a]&&A[e.b]){ A[e.a].push({to:e.b,w:e.w,e:e.id}); A[e.b].push({to:e.a,w:e.w,e:e.id}); } });
  for(const k in A) A[k].sort((x,y)=>lab(m,x.to).localeCompare(lab(m,y.to)));
  return A;
}
function edgeBetween(m,a,b,extra){ const es = extra? m.edges.concat(extra): m.edges; return es.find(e=>(e.a===a&&e.b===b)||(e.a===b&&e.b===a)); }
function dijkstra(m, src){
  const A = adj(m), d = {}, done = new Set();
  m.nodes.forEach(n=>d[n.id]=Infinity); if(!(src in d)) return d; d[src]=0;
  while(true){
    let u=null; for(const k in d){ if(!done.has(k) && d[k]<Infinity && (u===null||d[k]<d[u])) u=k; }
    if(u===null) break; done.add(u);
    A[u].forEach(x=>{ if(d[u]+x.w<d[x.to]) d[x.to]=d[u]+x.w; });
  }
  return d;
}
function connected(m, extra){
  if(!m.nodes.length) return true;
  const A = adj(m, extra), seen = new Set([m.nodes[0].id]), st=[m.nodes[0].id];
  while(st.length){ const u=st.pop(); A[u].forEach(x=>{ if(!seen.has(x.to)){ seen.add(x.to); st.push(x.to);} }); }
  return seen.size===m.nodes.length;
}
const fmt1 = v => (Math.round(v*10)/10).toString();
const m100 = u => (Math.round(u*100)).toLocaleString("ko-KR")+" m";
function pathCost(m, path, extra){ let c=0; for(let i=1;i<path.length;i++){ const e=edgeBetween(m,path[i-1],path[i],extra); if(!e) return NaN; c+=e.w; } return c; }

/* Euler */
function eulerInfo(m, extra){
  const A = adj(m, extra);
  const deg = {}; m.nodes.forEach(n=>deg[n.id]=A[n.id].length);
  const odd = sortByLabel(m, m.nodes.filter(n=>deg[n.id]%2===1).map(n=>n.id));
  const conn = connected(m, extra);
  let verdict = !conn ? "끊김" : odd.length===0 ? "회로" : odd.length===2 ? "경로" : "불가능";
  let route = null;
  if(conn && (odd.length===0 || odd.length===2) && (m.edges.length + (extra?extra.length:0))>0){
    let s = odd.length===2 ? (odd.includes(m.start)? m.start : odd[0]) : m.start;
    route = hierholzer(m, s, extra);
  }
  return {deg, odd, conn, verdict, route};
}
function hierholzer(m, start, extra){
  const A = adj(m, extra); const used = new Set(); const st=[start], out=[];
  const ptr = {}; for(const k in A) ptr[k]=0;
  while(st.length){
    const u = st[st.length-1];
    while(ptr[u]<A[u].length && used.has(A[u][ptr[u]].e)) ptr[u]++;
    if(ptr[u]<A[u].length){ const x=A[u][ptr[u]]; used.add(x.e); st.push(x.to); }
    else out.push(st.pop());
  }
  return out.reverse();
}
function constructionOptions(m){
  const info = eulerInfo(m);
  if(!info.conn) return [];
  const odd = info.odd, res=[];
  if(odd.length===4 || odd.length===2){
    for(let i=0;i<odd.length;i++) for(let j=i+1;j<odd.length;j++){
      const a=odd[i], b=odd[j]; if(edgeBetween(m,a,b)) continue;
      const extra=[{id:"x1",a,b,w:Math.max(1,Math.round(dist2(m,a,b)/GRID))}];
      const r = eulerInfo(m, extra);
      res.push({a,b,extra,info:r});
    }
  }
  return res;
}
function postman(m){
  const info = eulerInfo(m); if(!info.conn) return null;
  const odd = info.odd; const total = m.edges.reduce((s,e)=>s+e.w,0);
  if(odd.length===0) return {extra:0,total,pairs:[]};
  if(odd.length!==4 && odd.length!==2) return null;
  const D = {}; odd.forEach(o=>D[o]=dijkstra(m,o));
  if(odd.length===2) return {extra:D[odd[0]][odd[1]], total:total+D[odd[0]][odd[1]], pairs:[[odd[0],odd[1]]], circuit:true};
  const [a,b,c,d] = odd; const opts=[[[a,b],[c,d]],[[a,c],[b,d]],[[a,d],[b,c]]];
  let best=null; opts.forEach(p=>{ const v=D[p[0][0]][p[0][1]]+D[p[1][0]][p[1][1]]; if(!best||v<best.extra) best={extra:v,pairs:p}; });
  return {...best,total:total+best.extra, circuit:true};
}
function dist2(m,a,b){ const A=nodeById(m,a),B=nodeById(m,b); return Math.hypot(A.x-B.x,A.y-B.y); }

/* Hamilton */
function hamilton(m){
  const A = adj(m), n=m.nodes.length, all=[];
  if(!nodeById(m,m.start)) return {paths:[],best:null};
  const vis=new Set([m.start]);
  (function dfs(u,path,c){
    if(all.length>5000) return;
    if(path.length===n){ all.push({path:path.slice(),cost:c}); return; }
    A[u].forEach(x=>{ if(!vis.has(x.to)){ vis.add(x.to); path.push(x.to); dfs(x.to,path,c+x.w); path.pop(); vis.delete(x.to);} });
  })(m.start,[m.start],0);
  all.sort((p,q)=>p.cost-q.cost);
  return {paths:all, best: all[0]||null};
}

/* Greedy best-first (탐지기) — 카드 규칙 그대로 */
function hOf(m,id){ const n=nodeById(m,id); return n? +n.h||0 : 0; }
function greedy(m){
  const A = adj(m), steps=[]; const parent={}; const visited=new Set();
  if(!nodeById(m,m.start)||!nodeById(m,m.goal)) return null;
  let basket=[m.start]; parent[m.start]=null;
  while(basket.length){
    basket.sort((a,b)=> hOf(m,a)-hOf(m,b) || lab(m,a).localeCompare(lab(m,b)));
    const u = basket.shift(); visited.add(u);
    if(u===m.goal){ steps.push({pop:u, basket:basket.slice()}); break; }
    A[u].forEach(x=>{ if(!visited.has(x.to) && !basket.includes(x.to)){ basket.push(x.to); parent[x.to]=u; } });
    steps.push({pop:u, basket:basket.slice().sort((a,b)=>hOf(m,a)-hOf(m,b)||lab(m,a).localeCompare(lab(m,b)))});
  }
  if(!visited.has(m.goal)) return {steps, path:null, cost:Infinity};
  const path=[]; for(let v=m.goal; v!==null; v=parent[v]) path.unshift(v);
  return {steps, path, cost:pathCost(m,path)};
}
/* A* (g + h 내비) */
function astar(m){
  const A = adj(m), steps=[]; if(!nodeById(m,m.start)||!nodeById(m,m.goal)) return null;
  const open = new Map([[m.start,{g:0,parent:null}]]), closed=new Map();
  const f = id => open.get(id).g + hOf(m,id);
  const sorted = () => [...open.keys()].sort((a,b)=> f(a)-f(b) || hOf(m,a)-hOf(m,b) || lab(m,a).localeCompare(lab(m,b)));
  let found=false;
  while(open.size){
    const u = sorted()[0]; const rec=open.get(u); open.delete(u); closed.set(u,rec);
    if(u===m.goal){ steps.push({pop:u,g:rec.g,open:[]}); found=true; break; }

/* ---------- analysis bundle ---------- */
function analyze(m){
  const n = m.nodes.length;
  const dT = dijkstra(m, m.goal);
  const eu = eulerInfo(m);
  const ham = hamilton(m);
  const g = greedy(m), a = astar(m);
  const shortest = dT[m.start];
  return {n, dT, eu, ham, g, a, shortest};
}

function checks(m, R){
  const out=[];
  const add=(st,t,d)=>out.push({st,t,d});
  add(R.n>=6&&R.n<=8?"ok":"warn", `장소 6~8곳`, `지금 ${R.n}곳`);
  const hasST = nodeById(m,m.start)&&nodeById(m,m.goal)&&m.start!==m.goal;
  add(hasST?"ok":"bad","출발점 S와 보물 T가 서로 다른 장소", hasST? `${lab(m,m.start)} → ${lab(m,m.goal)}`:"선택한 장소의 역할에서 지정");
  const conn = connected(m);
  add(conn?"ok":"bad","모든 장소가 도로로 이어짐", conn?"연결됨":"따로 떨어진 장소가 있음");
  const ints = m.edges.every(e=>Number.isInteger(e.w)&&e.w>=1);
  add(ints?"ok":"bad","도로 길이는 100 m 단위 정수", `도로 ${m.edges.length}개 · 총 ${m100(m.edges.reduce((s,e)=>s+e.w,0))}`);
  const hT = hOf(m,m.goal)===0;
  add(hT?"ok":"bad","보물 T의 h = 0", hT?"OK":`T의 h를 0으로`);
  const over = m.nodes.filter(nd=> isFinite(R.dT[nd.id]) && (+nd.h) > R.dT[nd.id] + 1e-9);
  add(over.length? "bad":"ok","h ≤ 보물까지 도로 최단 거리 (A* 최단 보장)", over.length? over.map(nd=>`${nd.label}: h ${fmt1(nd.h)} > 최단 ${R.dT[nd.id]}`).join(", ") : "모든 장소 통과");
  add(R.eu.conn?"ok":"bad","청소로봇 정답이 분명함", R.eu.conn? (R.eu.verdict==="불가능"? `홀수 점 ${R.eu.odd.length}개 → 공사권 문제`: `한붓그리기 ${R.eu.verdict}`):"지도 연결 필요");
  add(R.ham.best?"ok":"bad","배달드론: 모든 장소를 한 번씩 도는 경로가 있음", R.ham.best? `경로 ${R.ham.paths.length}개 · 최단 ${m100(R.ham.best.cost)}`:"S에서 출발하는 경로 없음 → 도로 추가");
  const fooled = R.g&&R.a&&R.g.path&&R.a.path&&R.g.cost>R.a.cost;
  add(fooled?"ok":"warn","탐지기가 속는 지도 (탐지기 경로 > A* 경로)", R.g&&R.a&&R.a.path? `탐지기 ${m100(R.g.cost)} · A* ${m100(R.a.cost)}`:"S·T 연결 필요");
  const fuel = +m.fuel/100;
  const fuelOk = R.a&&R.a.path&&R.g&&fuel>=R.a.cost && fuel<R.g.cost;
  add(fuelOk?"ok":(fooled?"bad":"warn"),"연료: A* 경로 ≤ 연료 < 탐지기 경로", `연료 ${(+m.fuel).toLocaleString("ko-KR")} m` + (fooled? ` · 권장 ${m100(R.a.cost)} 이상 ${m100(R.g.cost)} 미만`:""));
  return out;
}

/* ---------- animation ---------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function startAnim(path, color, edgesColor){
  const m=M(); if(!path||path.length<2) return;
  const es=new Set(); for(let i=1;i<path.length;i++){ const e=edgeBetween(m,path[i-1],path[i], (mode==="play"&&play&&play.extra)?[play.extra]:(anim&&anim.extra)||null); if(e) es.add(e.id); }
  highlight={edges:es,color:edgesColor||color};
  if(reduce){ anim=null; render(); return; }
  anim={path,color,t:0,start:performance.now()};
  const seg=650;
  const step=(now)=>{ if(!anim) return; anim.t=(now-anim.start)/seg; if(anim.t>=path.length-1){ anim.t=path.length-1; render(); setTimeout(()=>{anim=null;render();},500); return;} render(); requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function animPos(){
  const m=M(); const i=Math.floor(anim.t), f=anim.t-i;
  const A=nodeById(m,anim.path[i]), B=nodeById(m,anim.path[Math.min(i+1,anim.path.length-1)]); if(!A||!B) return null;
  const e = f<.5? 2*f*f : 1-Math.pow(-2*f+2,2)/2;
  return {x:A.x+(B.x-A.x)*e, y:A.y+(B.y-A.y)*e};
}

/* ---------- pointer ---------- */
let drag=null;
function svgPt(ev){ const pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
svg.addEventListener("pointerdown", ev=>{
  const nEl = ev.target.closest("[data-node]"), eEl = ev.target.closest("[data-edge]");
  const p = svgPt(ev);
  if(mode==="play"){ if(nEl) playTap(nEl.dataset.node); return; }
  if(nEl){
    const id=nEl.dataset.node;
    if(tool==="erase"){ removeNode(id); return; }
    if(tool==="road"){
      if(!pending){ pending=id; setHint(); render(); return; }
      if(pending===id){ pending=null; setHint(); render(); return; }
      addEdge(pending,id); pending=null; return;
    }
    sel={type:"node",id}; tab = "table";
    const n=nodeById(S,id); drag={id, dx:n.x-p.x, dy:n.y-p.y, moved:false};
    svg.setPointerCapture(ev.pointerId); renderAll(); return;
  }
  if(eEl){
    const id=eEl.dataset.edge;
    if(tool==="erase"){ S.edges=S.edges.filter(e=>e.id!==id); sel=null; commit(); return; }
    sel={type:"edge",id}; tab="table"; renderAll(); return;
  }
  if(tool==="place"){ addNode(p.x,p.y); return; }
  sel=null; pending=null; renderAll();
});
svg.addEventListener("pointermove", ev=>{
  if(!drag) return; const p=svgPt(ev); const n=nodeById(S,drag.id); if(!n) return;
  n.x=Math.max(30,Math.min(970,Math.round((p.x+drag.dx)/5)*5)); n.y=Math.max(30,Math.min(570,Math.round((p.y+drag.dy)/5)*5)); drag.moved=true; render();
});
const endDrag=()=>{ if(drag){ const mv=drag.moved; drag=null; if(mv) commit(); } };
svg.addEventListener("pointerup", endDrag); svg.addEventListener("pointercancel", endDrag);

function nextLabel(){ const used=new Set(S.nodes.map(n=>n.label)); for(const c of LETTERS) if(!used.has(c)) return c; return "?"; }
function addNode(x,y){
  if(S.nodes.length>=MAX_NODES){ toast(`장소는 최대 ${MAX_NODES}곳까지 (시간 안에 풀 수 있게!)`); return; }
  const id="n"+Date.now().toString(36);
  const x2=Math.round(x/25)*25, y2=Math.round(y/25)*25;
  const b=BMAP[placeKind]||BMAP.other; let nm = b.k==="other"? "" : b.n;
  if(nm && S.nodes.some(n=>n.name===nm)){ let i=2; while(S.nodes.some(n=>n.name===nm+i)) i++; nm=nm+i; }
  const node={id,label:nextLabel(),name:nm,kind:b.k,x:Math.max(30,Math.min(970,x2)),y:Math.max(30,Math.min(570,y2)),h:0};
  S.nodes.push(node); node.h = measureH(node);
  sel={type:"node",id}; tab="table"; commit();
  if(b.k==="other") setTimeout(()=>{ const i=document.getElementById("nodeName"); if(i) i.focus(); },30);
  toast(`${node.label} · ${nm||"새 장소"}를 놓았어요`);
}
function addEdge(a,b){
  if(edgeBetween(S,a,b)){ toast("이미 도로가 있어요"); render(); setHint(); return; }
  const w=Math.max(1,Math.min(20,Math.round(dist2(S,a,b)/GRID)));
  const id="e"+Date.now().toString(36); S.edges.push({id,a,b,w});
  sel={type:"edge",id}; tab="table"; commit(); toast(`도로 ${lab(S,a)}–${lab(S,b)} 길이 ${w*100} m (자로 잰 값, 바꿀 수 있어요)`);
}
function removeNode(id){
  if(id===S.start||id===S.goal){ toast("S와 T는 지울 수 없어요. 다른 장소를 S/T로 바꾼 뒤 지우세요"); return; }
  S.nodes=S.nodes.filter(n=>n.id!==id); S.edges=S.edges.filter(e=>e.a!==id&&e.b!==id); sel=null; commit();
}
function measureH(n){ const T=nodeById(S,S.goal); if(!T) return 0; if(n.id===T.id) return 0; return Math.round(Math.hypot(n.x-T.x,n.y-T.y)/GRID*10)/10; }

function panelClean(m,R,show){
  const eu=R.eu;
  const opts=constructionOptions(m);
  const pm=postman(m);
  const degRow = sortByLabel(m,m.nodes.map(n=>n.id)).map(id=>`<td class="mono" style="${eu.deg[id]%2?'color:var(--coral);font-weight:700':''}">${eu.deg[id]}</td>`).join("");

  if(!show) return body;
  let verdict = eu.verdict==="회로"? `<span class="pill ok">회로 가능</span> 홀수 점 0개 → 어디서 출발해도 제자리로` :
     eu.verdict==="경로"? `<span class="pill ok">경로 가능</span> 홀수 점 2개 → ${lab(m,eu.odd[0])}에서 출발, ${lab(m,eu.odd[1])}에서 끝` :
     eu.verdict==="끊김"? `<span class="pill bad">지도가 끊김</span>` : `<span class="pill warn">그대로는 불가능</span> 홀수 점이 ${eu.odd.length}개`;
  let html = `<h2><span class="dot" style="background:var(--mint)"></span>청소로봇 · 오일러</h2>
  <p class="muted small">모든 도로를 한 번씩만 청소할 수 있을까?</p>${body}
  <div class="answer">${verdict}${eu.route? `<div style="margin-top:6px">청소 순서 예</div>${routeHTML(m,eu.route)}<div class="btnrow"><button class="btn mint" data-anim="clean">청소로봇 출발</button></div>`:""}</div>`;
  if(eu.verdict==="불가능"){
    html += `<h3>도로 공사권 1장으로 고치기</h3>`;
    if(opts.length){
      html += opts.map((o,i)=>`<div class="answer"><b>${lab(m,o.a)} – ${lab(m,o.b)}</b> 새 도로 → 홀수 점 ${o.info.odd.map(id=>lab(m,id)).join(" · ")||"없음"} (${o.info.odd.length}개) <span class="pill ${o.info.verdict==="불가능"?"warn":"ok"}">${o.info.verdict}</span>${o.info.route?`${routeHTML(m,o.info.route)}<div class="btnrow"><button class="btn mint" data-anim-ct="${i}">공사 후 청소 출발</button></div>`:""}</div>`).join("");
    } else html += `<p class="muted small">${eu.odd.length>4? "홀수 점이 4개보다 많아 공사권 1장으로는 부족해요. 도로를 바꿔 홀수 점을 4개 이하로 줄여 보세요.":"홀수 점끼리 이미 모두 도로가 있어 새 도로를 놓을 곳이 없어요."}</p>`;
  }
  if(pm && pm.extra>0) html += `<h3>심화 · 중국인 우체부 (공사권 없이 제자리로)</h3><p>${pm.pairs.map(p=>`${lab(m,p[0])}–${lab(m,p[1])}`).join(" , ")} 짝짓기 → 추가 <b class="mono">${m100(pm.extra)}</b>, 총 <b class="mono">${m100(pm.total)}</b></p>`;
  return html;
}

function panelDeliver(m,R,show){
  const H=R.ham;
  let html=`<h2><span class="dot" style="background:var(--blue)"></span>배달드론 · 해밀턴</h2>
  <p class="muted small">${esc(lab(m,m.start))}에서 출발해 모든 장소를 한 번씩 들르는 가장 짧은 경로 (돌아올 필요 없음)</p>`;
  if(!show) return html;
  if(!H.best){ return html+`<div class="answer"><span class="pill bad">경로 없음</span> 출발점에서 모든 장소를 한 번씩 갈 수 없어요. 도로를 더 놓아 보세요.</div>`; }
  html+=`<div class="answer">가능한 경로 <b class="mono">${H.paths.length}</b>개 · 최단 <b class="mono">${m100(H.best.cost)}</b>${routeHTML(m,H.best.path)}<div class="small mono muted">${sumExpr(m,H.best.path)} → ${m100(H.best.cost)}</div><div class="btnrow"><button class="btn blue" data-anim="deliver">배달드론 출발</button></div></div>`;
  html+=`<h3>모든 경로 (짧은 순)</h3><div class="tbl-wrap"><table><thead><tr><th>#</th><th>경로</th><th>길이</th><th></th></tr></thead><tbody>${H.paths.slice(0,40).map((p,i)=>`<tr><td class="mono">${i+1}</td><td class="mono">${p.path.map(id=>esc(lab(m,id))).join("→")}</td><td class="mono">${m100(p.cost)}</td><td><button class="btn" data-ham="${i}" style="padding:2px 8px">보기</button></td></tr>`).join("")}</tbody></table></div>${H.paths.length>40?`<p class="small muted">상위 40개만 표시</p>`:""}
  <p class="small muted">건물이 n개면 순서를 정하는 방법이 최대 (n−1)! 가지 — 장소가 늘수록 배달드론이 힘든 이유예요.</p>`;
  return html;
}

function traceG(m,g){ return `<div class="tbl-wrap"><table class="trace"><thead><tr><th>차례</th><th>꺼낸 건물 (h)</th><th>후보 바구니 (h)</th></tr></thead><tbody>${g.steps.map((s,i)=>`<tr><td class="mono">${i+1}</td><td class="mono"><b>${esc(lab(m,s.pop))}</b> (${fmt1(hOf(m,s.pop))})</td><td class="mono small">${s.basket.map(id=>`${esc(lab(m,id))}(${fmt1(hOf(m,id))})`).join(" ")||"—"}</td></tr>`).join("")}</tbody></table></div>`; }
function traceA(m,a){ return `<div class="tbl-wrap"><table class="trace"><thead><tr><th>차례</th><th>꺼낸 건물 g+h</th><th>후보 바구니 g+h=f</th></tr></thead><tbody>${a.steps.map((s,i)=>`<tr><td class="mono">${i+1}</td><td class="mono"><b>${esc(lab(m,s.pop))}</b> ${s.g}+${fmt1(hOf(m,s.pop))}</td><td class="mono small">${s.open.map(o=>`${esc(lab(m,o.id))} ${o.g}+${fmt1(o.h)}=${fmt1(o.g+o.h)}`).join(" · ")||"—"}</td></tr>`).join("")}</tbody></table></div>`; }

function panelTreasure(m,R,show){
  const g=R.g, a=R.a, fuel=+m.fuel/100;
  let html=`<h2><span class="dot" style="background:var(--coral)"></span>보물탐지로봇 · 최상우선탐색 vs A*</h2>
  <p class="muted small">연료 <b>${(+m.fuel).toLocaleString("ko-KR")} m</b>로 ${esc(lab(m,m.start))}에서 보물 ${esc(lab(m,m.goal))}까지 갈 수 있을까?</p>`;
  if(!show) return html;
  if(!g||!a||!a.path) return html+`<div class="answer"><span class="pill bad">S와 T가 이어지지 않았어요</span></div>`;
  const ok = c => c<=fuel+1e-9;
  const tr = trap(m,g,a);
  html += `<div class="answer"><b>탐지기 모드</b> (h만 보기) <span class="pill ${ok(g.cost)?"ok":"bad"}">${ok(g.cost)?"성공":"실패"}</span>${routeHTML(m,g.path)}<div class="small mono muted">${sumExpr(m,g.path)} → ${m100(g.cost)} ${ok(g.cost)?`· ${m100(fuel-g.cost)} 남음`:`· ${m100(g.cost-fuel)} 부족`}</div><div class="btnrow"><button class="btn coral" data-anim="greedy">탐지기 출발</button></div></div>
  <div class="answer"><b>g + h 내비 (A*)</b> <span class="pill ${ok(a.cost)?"ok":"bad"}">${ok(a.cost)?"성공":"실패"}</span>${routeHTML(m,a.path)}<div class="small mono muted">${sumExpr(m,a.path)} → ${m100(a.cost)} ${ok(a.cost)?`· ${m100(fuel-a.cost)} 남음`:`· ${m100(a.cost-fuel)} 부족`}</div><div class="btnrow"><button class="btn mint" data-anim="astar">내비 출발</button></div></div>`;
  if(R.shortest<a.cost) html+=`<p><span class="pill bad">주의</span> 진짜 최단은 ${m100(R.shortest)}인데 A*가 ${m100(a.cost)}를 골랐어요. h가 도로 최단 거리보다 큰 곳이 없는지 점검표를 확인하세요.</p>`;
  if(tr&&g.cost>a.cost) html+=`<p>미끼 장소 <b>${esc(lab(m,tr.bait)||"—")}</b>${tr.bait?` (h ${fmt1(hOf(m,tr.bait))})`:""} · 범인 도로 <b>${tr.culprit?`${esc(lab(m,tr.culprit.a))}–${esc(lab(m,tr.culprit.b))} ${tr.culprit.w*100} m`:"—"}</b></p>`;
  else html+=`<p class="small"><span class="pill warn">탐지기가 속지 않음</span> 미끼 X(h 작음)를 출발점 이웃에, 범인 도로는 길게, 숨은 지름길 Y는 반대쪽에 두어 보세요.</p>`;
  html += `<h3>탐지기 추적표</h3>${traceG(m,g)}<h3>g + h 내비 추적표</h3>${traceA(m,a)}
  <p class="small muted">값이 같으면 기호 순서(가나다·ABC)로 꺼냅니다. A*는 같은 건물이 두 번 들어오면 g + h가 작은 쪽만 남겨요.</p>`;
  return html;
}

function panelCards(m,R){
  const eu=R.eu, opts=constructionOptions(m), H=R.ham, g=R.g, a=R.a, tr=trap(m,g,a);
  const tm = team||"______";
  if(ctPick===null||ctPick>=opts.length) ctPick = 0;
  const ct = eu.verdict==="불가능"? opts[ctPick] : null;
  const cleanBack = eu.verdict==="불가능"
    ? `홀수 점 ${eu.odd.map(id=>lab(m,id)).join(" · ")} → ${eu.odd.length}개, 그대로는 불가능<br>${ct? `공사권: ${lab(m,ct.a)}–${lab(m,ct.b)} 도로를 놓으면 홀수 점 ${ct.info.odd.map(id=>lab(m,id)).join(" · ")||"없음"} → ${ct.info.verdict} 가능<br>순서 예: ${ct.info.route? ct.info.route.map(id=>lab(m,id)).join("→"):"—"}`:"공사권 1장으로는 해결 안 됨"}`
    : eu.verdict==="끊김"? "지도가 끊겨 있음" : `홀수 점 ${eu.odd.length}개 → 한붓그리기 ${eu.verdict} 가능<br>순서 예: ${eu.route.map(id=>lab(m,id)).join("→")}`;
  const delivBack = H.best? `${lab(m,m.start)}에서 출발하는 경로 모두 ${H.paths.length}개<br>최단: ${H.best.path.map(id=>lab(m,id)).join(" → ")}<br>${sumExpr(m,H.best.path)} → ${m100(H.best.cost)}` : "경로 없음";
  const fuel=+m.fuel/100;
  const tBack = (g&&a&&a.path)? `탐지기 모드: ${g.path.map(id=>lab(m,id)).join("→")} · ${m100(g.cost)} · ${g.cost<=fuel? `${m100(fuel-g.cost)} 남기고 성공`:`${m100(g.cost-fuel)} 부족, 실패`}<br>g + h 내비: ${a.path.map(id=>lab(m,id)).join("→")} · ${m100(a.cost)} · ${a.cost<=fuel? `${m100(fuel-a.cost)} 남기고 성공`:`${m100(a.cost-fuel)} 부족, 실패`}${tr&&tr.bait&&g.cost>a.cost?`<br>미끼 ${lab(m,tr.bait)}(h ${fmt1(hOf(m,tr.bait))}) · 범인 도로 ${lab(m,tr.culprit.a)}–${lab(m,tr.culprit.b)} ${tr.culprit.w*100} m`:""}` : "S–T 연결 필요";
  const card=(color,name,front,back)=>`<div class="mcard"><div class="band" style="background:${color}"></div><div><div class="ttl"><span>${name} · 앞면 문제</span><span class="muted">출제: ${esc(tm)} 팀</span></div>${front}</div><div><div class="ttl"><span>뒷면 정답</span><span class="muted">접는 선 ┆</span></div>${back}</div></div>`;
  return `<h2>미션 카드 정답</h2>
  <p class="muted small">활동 카드 ⑧ 접이식 미션 카드에 그대로 옮겨 적으세요. 정답 면은 설계 팀이 보관해요.</p>
  ${opts.length>1&&eu.verdict==="불가능"? `<label class="field" style="margin:6px 0 10px">공사권 도로 선택<select id="ctPick">${opts.map((o,i)=>`<option value="${i}" ${i===ctPick?"selected":""}>${lab(m,o.a)} – ${lab(m,o.b)} (${o.info.verdict})</option>`).join("")}</select></label>`:""}
  <div class="cardsheet">
  ${card("var(--mint)","청소로봇 카드","모든 도로를 한 번씩 지날 수 있을까?<br>안 되면 공사권 1장을 어디에 쓸까?<br><span class='muted small'>힌트: 장소마다 차수부터 세어 보세요</span>",cleanBack)}
  ${card("var(--blue)","배달드론 카드",`${esc(lab(m,m.start))}에서 모든 장소를 한 번씩 들르는<br>가장 짧은 배달 순서는?<br><span class='muted small'>힌트: 출발점 이웃부터 가지치기로 적어 보세요</span>`,delivBack)}
  ${card("var(--coral)","보물탐지 카드",`연료 ${(+m.fuel).toLocaleString("ko-KR")} m로 보물 ${esc(lab(m,m.goal))}를 찾을 수 있을까?<br>탐지기 모드와 g + h 내비로 각각 추적하라.<br><span class='muted small'>힌트: 후보 바구니에 g, h, g + h를 모두 적으세요</span>`,tBack)}
  </div>
  <h3>2분 발표 대본 뼈대</h3>
  <p class="small">① 우리 지도는 장소 ${R.n}곳, 도로 ${m.edges.length}개, 총 ${m100(m.edges.reduce((s,e)=>s+e.w,0))}입니다. ② 홀수 점이 ${eu.odd.length}개라서 청소로봇은 ${eu.verdict==="불가능"?"공사권이 필요합니다":eu.verdict+"로 청소할 수 있습니다"}. ③ 배달드론 경로는 ${H.paths.length}가지 중 최단 ${H.best?m100(H.best.cost):"—"}입니다. ④ ${tr&&g&&a&&g.cost>a.cost? `탐지기는 h가 작은 ${lab(m,tr.bait)}에 속아 ${lab(m,tr.culprit.a)}–${lab(m,tr.culprit.b)} 긴 도로를 지나지만, g + h 내비는 ${m100(a.cost)} 지름길을 찾습니다.`:"탐지기와 내비가 같은 길을 찾습니다."}</p>`;
}

function wirePanel(m,R){
  const $=id=>document.getElementById(id);
  if($("nodeLabel")) $("nodeLabel").addEventListener("change",e=>{ const v=e.target.value.trim().toUpperCase().slice(0,2); const n=nodeById(S,sel.id); if(!v){ e.target.value=n.label; return;} if(S.nodes.some(x=>x.label===v&&x.id!==n.id)){ toast("같은 기호가 이미 있어요"); e.target.value=n.label; return;} n.label=v; commit(); });
  if($("nodeName")) $("nodeName").addEventListener("input",e=>{ nodeById(S,sel.id).name=e.target.value; save(); render(); });
  if($("nodeName")) $("nodeName").addEventListener("change",()=>commit());
  if($("nodeH")) $("nodeH").addEventListener("change",e=>{ const v=Math.max(0,parseFloat(e.target.value)||0); nodeById(S,sel.id).h=Math.round(v*10)/10; commit(); });
  if($("kindGrid")) $("kindGrid").querySelectorAll("[data-k]").forEach(bt=>bt.onclick=()=>{ const n=nodeById(S,sel.id); const old=BMAP[kindOf(n)]; const nb=BMAP[bt.dataset.k]; n.kind=nb.k; if(!n.name || (old && n.name.startsWith(old.n))) n.name = nb.k==="other"? n.name : nb.n; commit(); });
  if($("nodeRole")) $("nodeRole").addEventListener("change",e=>{ const v=e.target.value, id=sel.id;
    if(v==="s"){ if(id===S.goal){ toast("보물 T를 다른 장소로 먼저 옮기세요"); renderAll(); return;} S.start=id; }
    else if(v==="t"){ if(id===S.start){ toast("출발점 S를 다른 장소로 먼저 옮기세요"); renderAll(); return;} S.goal=id; S.nodes.forEach(n=>n.h=measureH(n)); toast("보물이 바뀌어 h를 다시 쟀어요"); }
    else { if(id===S.start||id===S.goal){ toast("S/T는 다른 장소를 S/T로 정하면 풀려요"); renderAll(); return;} }
    commit(); });
  const setW = v => { const e=S.edges.find(x=>x.id===sel.id); e.w=Math.max(1,Math.min(20,Math.round(v)||1)); commit(); };
  if($("edgeW")){ $("edgeW").addEventListener("change",e=>setW(+e.target.value)); $("wMinus").onclick=()=>setW(S.edges.find(x=>x.id===sel.id).w-1); $("wPlus").onclick=()=>setW(S.edges.find(x=>x.id===sel.id).w+1); $("delEdge").onclick=()=>{ S.edges=S.edges.filter(x=>x.id!==sel.id); sel=null; commit(); }; }
  const setF = v => { S.fuel=Math.max(0,Math.round(v)); commit(); };
  if($("fuel")){ $("fuel").addEventListener("change",e=>setF(+e.target.value)); $("fMinus").onclick=()=>setF(S.fuel-100); $("fPlus").onclick=()=>setF(S.fuel+100); }
  if($("fuelAuto")) $("fuelAuto").onclick=()=>setF(R.a.cost*100);
  if($("ctPick")) $("ctPick").addEventListener("change",e=>{ ctPick=+e.target.value; renderPanel(); });
  panel.querySelectorAll("[data-anim]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.anim;
    if(k==="clean") startAnim(R.eu.route, "#169C83");
    if(k==="deliver") startAnim(R.ham.best.path, "#2F6FD6");
    if(k==="greedy") startAnim(R.g.path, "#E9505A");
    if(k==="astar") startAnim(R.a.path, "#169C83");
  });
  panel.querySelectorAll("[data-anim-ct]").forEach(b=>b.onclick=()=>{
    const o=constructionOptions(S)[+b.dataset.animCt]; anim={extra:o.extra};
    S.edges.push({...o.extra[0]}); const path=o.info.route; startAnim(path,"#169C83");
    const wait=()=>{ if(anim) return setTimeout(wait,200); S.edges=S.edges.filter(e=>e.id!=="x1"); highlight=null; render(); };
    setTimeout(wait, 400);
  });
  panel.querySelectorAll("[data-ham]").forEach(b=>b.onclick=()=>startAnim(R.ham.paths[+b.dataset.ham].path,"#2F6FD6"));
}

/* ---------- play mode : 미션 게임 ---------- */
const MISSIONS = {clean:{t:"청소로봇",c:"var(--mint)"}, deliver:{t:"배달드론",c:"var(--blue)"}, treasure:{t:"보물탐지",c:"var(--coral)"}};
const SLOT_N = 5, ROUNDS = 3;
const SLOT_IDS = Array.from({length:SLOT_N},(_,i)=>String(i+1));
let mySlot = 1;
let DB = null, dbState = "connecting";
let boardMaps = {};   // "1".."5" -> {name, code, nodes, edges, at}
let game = null;      // class/game
let results = {};     // "r1-t2" -> {round, team, map, mission, state, startAt, timeMs, detail}
let resetArm = false;
let scoreCfg = {succ:10, fail:3, penalty:60};
const LOCAL_BOARD = "crr-board-v2";

function loadLocalBoard(){ try{ const o=JSON.parse(localStorage.getItem(LOCAL_BOARD)||"{}"); boardMaps=o.maps||{}; game=o.game||null; results=o.results||{}; }catch(e){ boardMaps={}; game=null; results={}; } }
function saveLocalBoard(){ try{ localStorage.setItem(LOCAL_BOARD, JSON.stringify({maps:boardMaps, game, results})); }catch(e){} }
function refreshBoard(){ updateSendBtn(); if((mode==="play" && (!play || play.game)) || mode==="teams" || mode==="score") renderPanel(); if(mode==="play") renderTabs(); }
function applyDoc(path, data){
  const [c,id]=path.split("/");
  if(c==="maps"){ const k=id.slice(1); if(data) boardMaps[k]=data; else delete boardMaps[k]; }
  else if(c==="class"){ game=data||null; }
  else if(c==="results"){ if(data) results[id]=data; else delete results[id]; }
}
async function put(path, data){
  if(DB){ try{ await DB.doc(path).set(data); }catch(e){ toast(e&&e.code==="invalid_argument"? "보드에 쓸 권한이 없어요. 선생님께 링크 권한(참여 가능)을 확인하세요":"저장하지 못했어요. 잠시 뒤 다시 눌러 주세요"); return false; } }
  applyDoc(path, data); if(!DB) saveLocalBoard(); refreshBoard(); return true;
}
async function del(path){
  if(DB){ try{ await DB.doc(path).delete(); }catch(e){ toast("지우지 못했어요"); return false; } }
  applyDoc(path, null); if(!DB) saveLocalBoard(); refreshBoard(); return true;
}
async function initDB(){
  loadLocalBoard();
  let db=null;
  try{ db = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ db=null; }
  if(!db){ dbState="local"; refreshBoard(); return; }
  DB=db; boardMaps={}; game=null; results={};
  const fallback=()=>{ dbState="local"; DB=null; loadLocalBoard(); refreshBoard(); };
  const timer=setTimeout(()=>{ if(dbState==="connecting") fallback(); },10000);
  try{
    DB.collection("maps").onSnapshot(snap=>{ clearTimeout(timer); dbState="shared"; const o={}; snap.docs.forEach(d=>{ if(/^t[1-9]$/.test(d.id)) o[d.id.slice(1)]=d.data(); }); boardMaps=o; refreshBoard(); }, ()=>{ clearTimeout(timer); fallback(); });
    let firstGame=true;
    DB.doc("class/game").onSnapshot(d=>{ game = d.exists? d.data() : null; const k=roundKey(game);
      if(!firstGame && game && game.status==="playing" && k!==lastRoundKey) showShuffle(game, game.round);
      lastRoundKey=k; firstGame=false; refreshBoard(); }, ()=>{});
    DB.collection("results").onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); results=o; refreshBoard(); }, ()=>{});
  }catch(e){ clearTimeout(timer); fallback(); }
}

function slotData(code){ const m=decodeMap(code); if(!m) return null; return {name:m.team||"", code:code.trim().replace(/\s+/g,""), nodes:m.nodes.length, edges:m.edges.length, at:Date.now()}; }

function miniMap(code){
  const m=decodeMap(code); if(!m) return "";

  const es=m.edges.map(e=>{ const a=nb(e.a), b=nb(e.b); return a&&b? `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#7D849E" stroke-width="10" stroke-linecap="round"/>`:""; }).join("");
  const ns=m.nodes.map(n=>{ const fill=n.id===m.start?"#20223F":n.id===m.goal?"#F5B301":"#fff", tc=n.id===m.start?"#fff":"#20223F"; return `<circle cx="${n.x}" cy="${n.y}" r="38" fill="${fill}" stroke="#20223F" stroke-width="8"/><text x="${n.x}" y="${n.y+15}" text-anchor="middle" font-size="44" font-weight="700" fill="${tc}">${esc(n.label)}</text>`; }).join("");

/* 랜덤 배정 */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function derange(ids){ for(let k=0;k<500;k++){ const p=shuffle(ids.slice()); if(p.every((v,i)=>v!==ids[i])){ const o={}; ids.forEach((v,i)=>o[v]=p[i]); return o; } } const o={}; ids.forEach((v,i)=>o[v]=ids[(i+1)%ids.length]); return o; }
function makeSchedule(ids){
  let best=null; const target=ids.length*Math.min(ROUNDS, ids.length-1);
  for(let t=0;t<3000;t++){
    const rounds=Array.from({length:ROUNDS},()=>derange(ids));
    const sc=ids.reduce((s,id)=>s+new Set(rounds.map(d=>d[id])).size,0);
    if(!best||sc>best.sc){ best={rounds,sc}; if(sc===target) break; }
  }
  const order={}; ids.forEach(id=>order[id]=shuffle(Object.keys(MISSIONS)));
  return best.rounds.map((d,r)=>Object.fromEntries(ids.map(id=>[id,{map:d[id],mission:order[id][r]}])));
}
async function startGame(){
  const ids=SLOT_IDS.filter(k=>boardMaps[k]);
  if(ids.length<SLOT_N){ toast(`${SLOT_N}개 조의 코드가 모두 등록되어야 시작할 수 있어요`); return; }
  const codes=Object.fromEntries(ids.map(k=>[k,boardMaps[k].code]));
  const names=Object.fromEntries(ids.map(k=>[k,boardMaps[k].name||""]));
  const g={status:"playing", round:1, rounds:ROUNDS, teams:ids, schedule:makeSchedule(ids), codes, names, scoring:{...scoreCfg}, startedAt:Date.now()};
  for(const id of Object.keys(results)) await del("results/"+id);
  lastRoundKey=roundKey(g);
  if(await put("class/game", g)) showShuffle(g,1);
}

function roundDone(g,r){ return g.teams.every(t=>{ const x=results[rid(r,t)]; return x&&(x.state==="success"||x.state==="fail"); }); }

async function doReset(kind){

function standings(g){
  const sc=g.scoring||scoreCfg;
  const rows=g.teams.map(t=>{ let pts=0, succ=0, fail=0, ms=0, done=0;
    for(let r=1;r<=g.rounds;r++){ const x=results[rid(r,t)]; if(!x||(x.state!=="success"&&x.state!=="fail")) continue; done++;
      if(x.state==="success"){ succ++; pts+=sc.succ; ms+=x.timeMs; } else { fail++; pts+=sc.fail; ms+=x.timeMs+sc.penalty*1000; } }
    return {t, pts, succ, fail, ms, done}; });
  rows.sort((a,b)=> b.done-a.done || a.ms-b.ms || b.pts-a.pts);
  return rows;
}
const fmtT2 = ms => { const t=Math.max(0,ms)/1000; return `${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,"0")}`; };
const fmtT = ms => { const s=Math.max(0,Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };

async function finishGame(success, detail){
  const G=play&&play.game; if(!G||G.finished) return;
  const timeMs=Date.now()-G.startAt, sc=(game&&game.scoring)||scoreCfg;

  await put("results/"+G.id, {round:G.round, team:G.team, map:play.slot, mission:G.mission, state:success?"success":"fail", startAt:G.startAt, timeMs, detail:String(detail||"").slice(0,120), at:Date.now()});

function showShuffle(g, r){

  const sch=g.schedule[r-1], mk=Object.keys(MISSIONS);

    <h2 id="shT">라운드 ${r} <span>/ ${g.rounds}</span></h2>
    <div class="deck" id="shDeck" aria-hidden="true">${g.teams.map((t,i)=>`<span class="dcard" style="--i:${i};--n:${teams.length}">${t}조<small>지도</small></span>`).join("")}</div>
    <div class="reels">${teams.map(t=>`<div class="reel ${+t===mySlot?"me":""}" id="rl${t}"><span class="who">${t}조${+t===mySlot?"<small>우리</small>":""}</span><span class="arr">→</span><span class="win"><b class="rm mono">?</b><span class="rmis">섞는 중</span></span></div>`).join("")}</div>
    <p class="shuf-msg" id="shMsg" aria-live="polite">지도 카드를 섞고 있어요…</p>
    <div class="btnrow" style="justify-content:center"><button class="btn" id="shAgain" hidden style="color:var(--ink)">다시 섞어 보기</button><button class="drawbtn" id="shOk" hidden style="width:auto;padding:10px 28px;margin-top:0">미션 보드로</button></div>
  </div></div>`;
  const $=id=>document.getElementById(id);
  const close=()=>{ shufTimers.forEach(t=>{ clearInterval(t); clearTimeout(t); }); root.innerHTML=""; };
  $("shOk").onclick=close; $("shAgain").onclick=()=>{ showShuffle(g,r); const m=document.getElementById("shMsg"); if(m) m.textContent="다시 섞는 중…"; };
  $("shOv").addEventListener("click",e=>{ if(e.target.id==="shOv" && !$("shOk").hidden) close(); });
  const setReel=(t,map,ms,final)=>{ const el=$("rl"+t); if(!el) return; el.querySelector(".rm").textContent=map+"조"; const mm=el.querySelector(".rmis"); mm.textContent=MISSIONS[ms].t; mm.style.background=MISSIONS[ms].c; if(final){ el.classList.add("set"); el.style.setProperty("--mc",MISSIONS[ms].c); } };
  const done=()=>{ $("shDeck").classList.add("done"); const my=sch[String(mySlot)];
    $("shMsg").innerHTML = my? `<b>${mySlot}조</b>는 <b>${my.map}조 지도</b>에서 <b>${MISSIONS[my.mission].t}</b> 미션!` : "모든 조의 미션이 정해졌어요!";
    $("shOk").hidden=false; $("shAgain").hidden=false; $("shOk").focus(); };
  const shuffleMs=reduce?600:1100, step=reduce?260:480;
  teams.forEach((t,i)=>{
    const others=g.teams.filter(x=>x!==t);
    const iv=setInterval(()=>setReel(t, others[Math.floor(Math.random()*others.length)], mk[Math.floor(Math.random()*mk.length)], false), 75);
    shufTimers.push(iv);
    shufTimers.push(setTimeout(()=>{ clearInterval(iv); setReel(t, sch[t].map, sch[t].mission, true); if(i===teams.length-1) setTimeout(done, 350); }, shuffleMs+i*step));
  });
  setTimeout(()=>{ const m=$("shMsg"); if(m&&$("shOk").hidden) m.textContent="한 조씩 미션이 정해져요…"; }, shuffleMs);
}

async function sha256hex(t){
  if(window.crypto&&crypto.subtle){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  return null;
}

function playUsedEdges(){
  const s=new Set(); if(!play) return s; const r=play.route, m=play.map, ex=play.extra?[play.extra]:null;
  for(let i=1;i<r.length;i++){ const e=edgeBetween(m,r[i-1],r[i],ex); if(e) s.add(e.id); } return s;
}

/* 보물탐지: 후보 바구니 / 방문 완료 추적 */
function trInit(){
  play.tr={mode:play.tmode, basket:new Map(), visited:[], log:[], cur:null, done:false, errors:0};
}
function trKey(m,id,rec){ return play.tr.mode==="g"? hOf(m,id) : rec.g+hOf(m,id); }
function trSorted(){ const m=play.map, T=play.tr; return [...T.basket.entries()].sort((x,y)=>trKey(m,x[0],x[1])-trKey(m,y[0],y[1])||lab(m,x[0]).localeCompare(lab(m,y[0]))); }
const trVisited = (T,id) => T.visited.some(v=>v.id===id);
function trCurG(T){ const v=T.cur? T.visited.find(x=>x.id===T.cur) : null; return v? v.g : 0; }
/* 지금 위치의 이웃 중 아직 바구니에 넣지 않은(또는 A*에서 더 짧게 갱신할) 건물 */
function trMissing(m,T){
  if(!T.cur) return [];
  const g0=trCurG(T);
  return adj(m)[T.cur].filter(x=>{ if(trVisited(T,x.to)) return false; const o=T.basket.get(x.to); if(!o) return true; return T.mode==="a" && g0+x.w<o.g; }).map(x=>x.to);
}
/* 지도에서 건물 누르기 → 후보 바구니에 넣기 */
function trAdd(id){
  const m=play.map, T=play.tr; if(!T) return;
  if(T.done){ toast("보물에 도착했어요. 미션이 끝났어요"); return; }
  if(trVisited(T,id)){ toast(`${lab(m,id)}는 방문 완료된 건물이라 바꿀 수 없어요`); return; }
  if(!T.cur){
    if(T.basket.size===0){
      if(id!==m.start){ toast(`먼저 출발점 ${lab(m,m.start)}를 눌러 후보 바구니에 넣어요`); return; }
      T.basket.set(id,{g:0,parent:null}); renderAll(); toast(`${lab(m,id)}를 후보 바구니에 넣었어요. 이제 바구니에서 꺼내요`); return;
    }
    toast(`후보 바구니의 ${lab(m,m.start)} 카드를 눌러 꺼내요`); return;
  }
  const e=edgeBetween(m,T.cur,id);
  if(!e){ toast(`지금 위치 ${lab(m,T.cur)}와 도로로 이어진 이웃만 넣을 수 있어요`); return; }
  const ng=trCurG(T)+e.w, o=T.basket.get(id), last=T.log[T.log.length-1];
  if(!o){ T.basket.set(id,{g:ng,parent:T.cur}); if(last) last.added.push(lab(m,id)); renderAll(); toast(`${lab(m,id)} 넣기 · ${T.mode==="g"?`h ${fmt1(hOf(m,id))}`:`g ${ng} + h ${fmt1(hOf(m,id))} = ${fmt1(ng+hOf(m,id))}`}`); return; }
  if(T.mode==="a" && ng<o.g){ T.basket.set(id,{g:ng,parent:T.cur}); if(last) last.added.push(lab(m,id)+" (갱신)"); renderAll(); toast(`${lab(m,id)}는 더 짧은 길을 찾아 g ${o.g} → ${ng}로 갱신했어요`); return; }
  toast(T.mode==="a"? `${lab(m,id)}는 이미 바구니에 있고, 그쪽 g + h가 더 작아요` : `${lab(m,id)}는 이미 후보 바구니에 있어요`);
}
/* 후보 바구니 카드 누르기 → 방문 완료로 옮기기 */
function trPick(id){
  const m=play.map, T=play.tr; if(!T||T.done) return; if(play.game&&play.game.finished) return;
  if(!T.basket.has(id)){ toast(trVisited(T,id)? `${lab(m,id)}는 방문 완료된 건물이라 바꿀 수 없어요` : `${lab(m,id)}는 아직 후보 바구니에 없어요`); return; }
  const miss=trMissing(m,T);
  if(miss.length){ toast(`먼저 ${lab(m,T.cur)}의 이웃 ${miss.length}곳을 지도에서 눌러 바구니에 넣어요`); return; }
  let min=Infinity; T.basket.forEach((r,k)=>{ min=Math.min(min,trKey(m,k,r)); });
  const rec=T.basket.get(id);
  if(trKey(m,id,rec)>min+1e-9){
    T.errors++;
    const best=[...T.basket].filter(([k,r])=>Math.abs(trKey(m,k,r)-min)<1e-9).map(([k])=>lab(m,k)).join(", ");
    if(play.game&&!play.game.finished){ finishGame(false, `후보 바구니 규칙 위반: ${lab(m,id)} 대신 ${best}`); toast(`심판: 규칙 위반! ${best}를 먼저 꺼내야 해요 → 미션 실패`); return; }
    toast(`심판: 규칙 위반! ${T.mode==="g"?"h":"g + h"}가 더 작은 ${best}부터 꺼내요`); renderPanel(); return;
  }
  const before=trSorted().map(([k,r])=>({id:k,g:r.g}));
  T.basket.delete(id); T.visited.push({id,g:rec.g,parent:rec.parent}); T.cur=id;
  T.log.push({pop:id, g:rec.g, h:hOf(m,id), added:[], before});
  if(id===m.goal){
    T.done=true; const path=[]; let v=T.visited.find(x=>x.id===id); while(v){ path.unshift(v.id); const pid=v.parent; v=pid? T.visited.find(x=>x.id===pid):null; }
    T.path=path; T.cost=rec.g;
    play.results=play.results||{}; play.results[T.mode]={path, cost:rec.g, errors:T.errors};
    if(play.game) setTimeout(()=>finishGame(rec.g*100<=m.fuel, `보물 도착 ${m100(rec.g)} / 연료 ${m.fuel} m`), 50);
  }
  highlight=null;
  if(rec.parent){ startAnim([rec.parent,id], T.mode==="g"?"#E9505A":"#169C83"); setTimeout(()=>{ if(!anim){ highlight=null; render(); } }, 900); }
  renderAll();
  if(T.done) toast(rec.g*100<=m.fuel? `보물 도착! 연료 ${m100(rec.g)} 사용 → 성공`:`보물 도착… 연료 ${m100(rec.g)} 필요 → 연료 부족, 실패`);
  else toast(`${lab(m,id)} 방문 완료 · 이제 ${lab(m,id)}의 이웃을 지도에서 눌러 바구니에 넣어요`);
}
function trStep(m,T){ if(T.done) return 0; if(!T.cur) return T.basket.size? 3 : 1; return trMissing(m,T).length? 2 : 3; }
function trNext(m,T){
  const st=trStep(m,T);
  if(st===1) return `다음: 지도에서 출발점 <b>${esc(lab(m,m.start))}</b>를 눌러 후보 바구니에 넣으세요`;
  if(st===2){ const n=trMissing(m,T).length; return `다음: 지금 위치 <b>${esc(lab(m,T.cur))}</b>와 도로로 이어진 이웃을 지도에서 눌러 바구니에 넣으세요 · <b>${n}곳</b> 남음`; }
  return `다음: 후보 바구니에서 ${T.mode==="g"?"h":"g + h"}가 가장 작은 카드를 눌러 꺼내세요`;
}
function treasureHTML(m){
  const T=play.tr, fuelU=+m.fuel/100, used=T.cur? T.visited.find(v=>v.id===T.cur).g : 0;
  const cells=Math.max(1,Math.ceil(fuelU)), tot=Math.max(cells,Math.ceil(used));
  const gauge=Array.from({length:tot},(_,i)=>`<i class="${i<used? (i<cells?"on":"over"):""}"></i>`).join("");
  const keyLbl = T.mode==="g"? "h" : "f = g + h";
  const bcards = trSorted().map(([id,r])=>{ const n=nodeById(m,id);
    return `<button class="bcard" data-pick="${id}"><b>${esc(n.label)}</b><span class="small">${esc(n.name||"")}</span><div class="mono">${T.mode==="g"? `h ${fmt1(+n.h||0)}` : `${r.g} + ${fmt1(+n.h||0)} = <b style="display:inline;font-size:12px">${fmt1(r.g+(+n.h||0))}</b>`}</div></button>`; }).join("") || `<span class="small muted">비었어요</span>`;
  const vcards = T.visited.map((v,i)=>{ const n=nodeById(m,v.id); return `<div class="bcard done" title="방문 완료 · 바꿀 수 없음"><span class="small muted">${i+1}번째 · 고정</span><b>${esc(n.label)}</b><div class="mono">g ${v.g}</div></div>`; }).join("") || `<span class="small muted">아직 없음</span>`;
  const log = T.log.length? `<h3>추적표 (기록원)</h3><div class="tbl-wrap"><table class="trace"><thead><tr><th>차례</th><th>후보 바구니 (${keyLbl})</th><th>꺼낸 건물</th><th>넣은 이웃</th></tr></thead><tbody>${T.log.map((r,i)=>`<tr><td class="mono">${i+1}</td><td class="mono small">${r.before.map(o=>`${esc(lab(m,o.id))} ${T.mode==="g"?fmt1(hOf(m,o.id)):fmt1(o.g+hOf(m,o.id))}`).join(" · ")||"—"}</td><td class="mono"><b>${esc(lab(m,r.pop))}</b> ${T.mode==="g"?`h ${fmt1(r.h)}`:`${r.g}+${fmt1(r.h)}`}</td><td class="small">${r.added.join(", ")||(r.pop===m.goal?"보물 도착":"—")}</td></tr>`).join("")}</tbody></table></div>`:"";
  let out = (play.game? `<p class="small" style="margin-top:6px"><span class="pill" style="background:var(--mint);color:#fff">g + h 내비 미션</span></p>` : `<div class="modes" role="group" aria-label="탐색 방법" style="margin-top:6px"><button id="tmG" aria-pressed="${T.mode==="g"}">탐지기 모드 (h)</button><button id="tmA" aria-pressed="${T.mode==="a"}">g + h 내비</button></div>`) + `
  <p class="small" style="margin-top:8px">${T.mode==="g"? "규칙: 후보 바구니에서 <b>h가 가장 작은</b> 건물을 꺼내요." : "규칙: 후보 바구니에서 <b>g + h가 가장 작은</b> 건물을 꺼내요. 같은 건물이 더 짧은 길로 다시 들어오면 g + h가 작은 쪽만 남겨요."}</p>
  <ol class="trsteps small"><li class="${!T.cur&&T.basket.size===0?"on":""}"><b>지도</b>에서 건물을 누르면 → <b>후보 바구니</b>에 들어가요 (처음엔 출발점 ${esc(lab(m,m.start))}, 그다음엔 지금 위치의 이웃)</li><li class="${trStep(m,T)===3?"on":""}"><b>후보 바구니</b> 카드를 누르면 → 로봇이 이동하고 <b>방문 완료</b>로 옮겨져요</li><li><b>방문 완료</b>된 건물은 다시 넣거나 바꿀 수 없어요</li></ol>
  ${T.done? "" : `<div class="nextstep">${trNext(m,T)}</div>`}
  <div class="small">연료 게이지 <b class="mono">${m100(used)}</b> / ${(+m.fuel).toLocaleString("ko-KR")} m</div><div class="gauge" aria-hidden="true">${gauge}</div>
  <div class="bk"><section class="q"><h4><span>후보 바구니</span><span class="muted small">우선순위 큐</span></h4><div class="bcards">${bcards}</div></section>
  <section class="v"><h4><span>방문 완료</span><span class="muted small">다시 꺼내지 않음</span></h4><div class="bcards">${vcards}</div></section></div>`;
  if(T.errors) out+=`<p class="small"><span class="pill warn">규칙 위반 ${T.errors}번</span> 심판이 잡아냈어요</p>`;
  if(T.done){ const ok=T.cost<=fuelU+1e-9; out+=`<div class="answer" style="border-style:solid;border-color:${ok?"var(--ok)":"var(--bad)"}"><span class="pill ${ok?"ok":"bad"}">${ok?"성공":"실패"}</span> 경로 ${routeHTML(m,T.path)}<div class="small mono">${sumExpr(m,T.path)} → ${m100(T.cost)} ${ok?`· ${m100(fuelU-T.cost)} 남음`:`· ${m100(T.cost-fuelU)} 부족`}</div>${T.mode==="g"&&!play.results?.a&&!play.game?`<div class="btnrow"><button class="btn mint" id="tryA">이번엔 g + h 내비로</button></div>`:""}</div>`; }
  if(play.results&&play.results.g&&play.results.a) out+=`<p class="small">탐지기 ${m100(play.results.g.cost)} vs 내비 ${m100(play.results.a.cost)} → ${play.results.g.cost>play.results.a.cost? `탐지기가 <b>${m100(play.results.g.cost-play.results.a.cost)}</b> 더 썼어요. 어디서 속았을까요?`:"두 방법이 같은 길이에요"}</p>`;
  return out+log;
}

function playTap(id){
  if(!play) return;
  if(play.game&&play.game.finished){ toast("미션이 끝났어요. 미션 보드로 돌아가세요"); return; }
  if(tab==="treasure"){ trAdd(id); return; }
  const m=play.map, r=play.route, ex=play.extra?[play.extra]:null;
  if(play.ctMode){
    if(!play.ctFirst){ play.ctFirst=id; toast(`공사권: ${lab(m,id)} 선택, 이어질 장소를 누르세요`); return; }
    if(play.ctFirst===id||edgeBetween(m,play.ctFirst,id)){ toast("도로가 없는 두 장소를 고르세요"); play.ctFirst=null; return; }
    play.extra={id:"x1",a:play.ctFirst,b:id,w:Math.max(1,Math.round(dist2(m,play.ctFirst,id)/GRID))};
    play.ctMode=false; play.ctFirst=null; play.route=[]; renderAll(); toast("공사권 도로를 놓았어요. 다시 청소를 시작하세요"); return;
  }
  if(play.done) return;
  if(!r.length){
    if((play.mission!=="clean") && id!==m.start){ toast(`출발점 ${lab(m,m.start)}에서 시작해요`); return; }
    r.push(id); renderAll(); return;
  }
  const last=r[r.length-1]; const e=edgeBetween(m,last,id,ex);
  if(!e){ toast(`${lab(m,last)}와 ${lab(m,id)}는 도로로 이어지지 않았어요`); return; }
  if(play.mission==="clean"){
    if(playUsedEdges().has(e.id)){ play.fail=`같은 도로 ${lab(m,e.a)}–${lab(m,e.b)}를 두 번 지났어요. 실패!`; play.done=true; if(play.game) finishGame(false, play.fail); renderAll(); return; }
    r.push(id);
    if(playUsedEdges().size===m.edges.length+(play.extra?1:0)){ play.done=true; play.win="모든 도로를 한 번씩 청소했어요!"; if(play.game) finishGame(true, "모든 도로 청소"); }
  } else {
    if(r.includes(id)){ toast(`${lab(m,id)}는 이미 들렀어요`); return; }
    r.push(id);
    if(r.length===m.nodes.length){ play.done=true; const c=pathCost(m,r), best=hamilton(m).best; const ok=best&&c===best.cost; play.win=`모든 장소 배달 완료 · ${m100(c)}`+(play.game? (ok?" · 최단 경로!":` · 최단보다 ${m100(c-best.cost)} 김`):""); if(!ok&&play.game){ play.fail=`최단 경로가 아니에요 (${m100(c)} > 최단 ${m100(best.cost)})`; play.win=null; } if(play.game) finishGame(ok, ok?`최단 ${m100(c)}`:play.fail); }
  }
  if(r.length>1) startAnim([r[r.length-2], id], play.mission==="clean"?"#169C83":"#2F6FD6");
  renderAll();
}
